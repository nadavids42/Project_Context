[project]
name = "project-context"
version = "0.1.0"
description = "Local, single-user, evidence-backed project intelligence prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "python-ulid>=2,<5",
    "python-docx>=1.1,<2",
    "pypdf>=5.0,<7",
    "webvtt-py>=0.5,<1",
    "openai>=3.3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Makes tests/fixtures/ importable as `fixtures.*` from any test module,
# without an `__init__.py` chain from the repo root.
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["project_context"]
